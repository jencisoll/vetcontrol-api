version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vetcontrol-db
    environment:
      POSTGRES_DB: vetcontrol
      POSTGRES_USER: vetcontrol
      POSTGRES_PASSWORD: vetcontrol123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetcontrol -d vetcontrol"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vetcontrol-network

  api:
    build: .
    container_name: vetcontrol-api
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vetcontrol
      DB_USER: vetcontrol
      DB_PASSWORD: vetcontrol123
      JWT_SECRET: vetcontrol-super-secret-key-2026-change-in-production-32bytes
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vetcontrol-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  vetcontrol-network:
    driver: bridge
